<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{box-sizing:border-box}body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#0A1128;color:#F8FAFC;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
.top{height:8px;background:#D90429;width:100%}
.content{min-height:712px;padding:56px 76px 0 76px;display:flex;flex-direction:column}
.eyebrow{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#CBD5E1;font-weight:700}
.main{display:flex;flex-direction:row;padding-top:78px;min-height:440px}
.left{width:760px}
h1{font-size:62px;line-height:1.04;letter-spacing:-2px;margin:0;font-weight:800}
.accent{color:#F0445B}
.sub{font-size:24px;line-height:1.35;color:#CBD5E1;max-width:680px;margin-top:24px}
.loop{width:310px;margin-left:auto;border-left:2px solid #334155;padding-left:28px;padding-top:4px}
.loop-label{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#94A3B8;margin-bottom:18px}
.step{font-size:24px;line-height:1.55;font-weight:700}
.step span{color:#F0445B;padding-right:12px}
.footer{margin-top:auto;border-top:1px solid #334155;padding-top:13px;font-size:14px;color:#94A3B8;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="slide-container">
<div class="top"></div>
<div class="content">
<div class="eyebrow">Executive protocol briefing · Decision Control Plane</div>
<div class="main">
<div class="left"><h1>RPO Admission Control<br>and <span class="accent">Fencing</span></h1><div class="sub">The control that turns active-active uncertainty into safe, typed outcomes.</div></div>
<div class="loop"><div class="loop-label">The operating loop</div><div class="step"><span>01</span>Measure</div><div class="step"><span>02</span>Admit</div><div class="step"><span>03</span>Fence</div><div class="step"><span>04</span>Reconcile</div></div>
</div>
<div class="footer"><div>Production safety · replayability · action integrity</div><div>August 2026</div></div>
</div>
</div>
</body>
</html>
